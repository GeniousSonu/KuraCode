name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm brand:check

      # e2e needs a virtual display for the headed Chromium that loads the extension.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e
        run: xvfb-run --auto-servernum pnpm --filter @kuracode/extension e2e
