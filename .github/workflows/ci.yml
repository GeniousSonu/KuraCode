name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-ubuntu:
    name: Full Quality Gate (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Brand asset regeneration & check
        run: |
          pnpm brand:build
          pnpm brand:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit & Migration tests
        run: pnpm test

      - name: Build dual extensions & web
        run: pnpm build

      - name: Single-source Version Integrity
        run: node --experimental-strip-types scripts/version-integrity.ts

      - name: Release & Permissions Gate
        run: node --experimental-strip-types scripts/release-check.ts

      - name: Documentation Freshness Check
        run: node --experimental-strip-types scripts/docs-freshness.ts

      - name: web-ext lint (Firefox output)
        run: node scripts/web-ext-lint.mjs packages/extension/.output/firefox-mv3

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Scenarios & Redesign Measurement
        run: xvfb-run --auto-servernum pnpm --filter @kuracode/extension e2e

      - name: Package Release Archives
        run: pnpm package

      - name: Verify Release Contents Allow-List
        run: node --experimental-strip-types scripts/verify-release-contents.ts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuracode-build-artifacts
          path: release/*
          retention-days: 7
          if-no-files-found: error

  smoke-cross-platform:
    name: Build Smoke (${{ matrix.os }})
    needs: [verify-ubuntu]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Cross-platform Build
        run: |
          pnpm brand:build
          pnpm build:chrome
          pnpm build:firefox
