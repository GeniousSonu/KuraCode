name: Nightly Cross-Surface E2E & Policy Audit

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly-audit:
    name: Nightly E2E & Policy Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high

      - name: Build extensions
        run: |
          pnpm brand:build
          pnpm build

      - name: Install Playwright Browsers (Chromium & Firefox)
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E Test Suite
        run: xvfb-run --auto-servernum pnpm --filter @kuracode/extension e2e

      - name: Store Policy & Permissions Audit
        run: |
          node --experimental-strip-types scripts/release-check.ts
          node --experimental-strip-types scripts/docs-freshness.ts

      - name: Open Issue on Nightly Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[NIGHTLY-FAILURE] Automated nightly run failed on ${new Date().toISOString().split('T')[0]}`,
              body: `Nightly cross-surface E2E, dependency audit, or policy checks failed.\n\nPlease inspect workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated-alert']
            });
