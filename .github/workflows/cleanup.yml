name: Cleanup Stale Artifacts & Prereleases

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: Clean Stale CI Artifacts & Old Drafts
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than 30 days
        uses: actions/github-script@v7
        with:
          script: |
            const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
            });

            for (const run of runs.data.workflow_runs) {
              const runDate = new Date(run.created_at);
              if (runDate < thirtyDaysAgo && run.status === 'completed') {
                console.log(`Deleting old workflow run ${run.id} (${run.created_at})...`);
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (e) {
                  console.warn(`Could not delete run ${run.id}:`, e.message);
                }
              }
            }

      - name: Prune Old Draft Releases (> 30 days, preserving all tagged releases)
        uses: actions/github-script@v7
        with:
          script: |
            const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
            });

            // Count stable releases to ensure we never delete stable versions
            for (const rel of releases.data) {
              if (rel.draft && new Date(rel.created_at) < thirtyDaysAgo) {
                console.log(`Deleting abandoned draft release ${rel.name || rel.id}...`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: rel.id,
                });
              }
            }

