name: Release Build & Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and test without publishing to store channels)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  check-freeze:
    name: Safety Check (Release Freeze)
    runs-on: ubuntu-latest
    steps:
      - name: Check if release is frozen
        run: |
          if [ "${{ vars.RELEASE_FROZEN }}" = "true" ]; then
            echo "::error::Release pipeline is FROZEN via repository variable RELEASE_FROZEN=true. Aborting release."
            exit 1
          fi
          echo "✔ Release pipeline is active (RELEASE_FROZEN is not true)."

  build-and-verify:
    name: Clean Rebuild & Verification Gate
    needs: [check-freeze]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      is_prerelease: ${{ steps.pkg.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean environment (wipe stale outputs)
        run: bash scripts/clean.sh

      - name: Full Quality Gate from Scratch
        run: bash scripts/verify.sh

      - name: Package Release Archives & Generate Checksums
        run: |
          pnpm package
          node --experimental-strip-types scripts/verify-release-contents.ts
          node --experimental-strip-types scripts/version-integrity.ts

      - name: Extract Version & Prerelease Metadata
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${VERSION}" == *"-"* ]] || [[ "${{ github.ref }}" == *"beta"* ]] || [[ "${{ github.ref }}" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/*
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.json
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.pkg.outputs.is_prerelease == 'true' }}

      - name: Open Issue on Release Build Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[RELEASE-BLOCKED] Release verification failed for ${context.ref}`,
              body: `The automated release build failed one or more verification gates.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['release', 'security']
            });

  publish:
    name: Publish to Extension Stores
    needs: [build-and-verify]
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.build-and-verify.outputs.version }}
      dry_run: ${{ github.event.inputs.dry_run == true || needs.build-and-verify.outputs.is_prerelease == 'true' }}
    secrets: inherit
