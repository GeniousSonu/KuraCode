<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KuraCode</title>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/inter-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('fonts/inter-medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('fonts/inter-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/jetbrains-mono-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('fonts/jetbrains-mono-medium.woff2') format('woff2');
      }

      :root {
        --brand-primary: #00b96c;
        --brand-light: #08e88a;
        --accent-mint: #00b96c;
        --bg-app: #0c0d10;
        --bg-surface: #14171c;
        --bg-surface-elevated: #1a1e24;
        --bg-code: #0e1014;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-default: rgba(255, 255, 255, 0.12);
        --border-focus: #00b96c;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --color-success: #00b96c;
        --color-danger: #ef4444;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --font-ui: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-app);
        color: var(--text-primary);
        font: 400 13px/1.45 var(--font-ui);
        font-feature-settings: "tnum" 1, "cv05" 1;
        -webkit-font-smoothing: antialiased;
      }
      body {
        width: 380px;
        height: 520px;
        overflow: hidden;
      }
      #app, .kura-app {
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
      }

      /* 1. Header (48px Fixed) */
      .kura-header {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
        position: relative;
      }
      .kura-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .kura-logo-icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }
      .kura-brand-name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .kura-header-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
      }

      /* Sync Badge */
      .kura-sync-badge {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 7px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
      }
      .kura-sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-muted);
      }
      .kura-sync-badge.synced .kura-sync-dot {
        background: var(--brand-primary);
      }

      /* Header Buttons */
      .kura-header-btn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-secondary);
        border-radius: var(--radius-sm);
        padding: 4px 8px;
        font: 500 12px var(--font-ui);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .kura-header-btn:hover {
        background: var(--bg-surface-elevated);
        color: var(--text-primary);
        border-color: var(--border-subtle);
      }
      .kura-header-btn.kura-icon-btn {
        padding: 5px;
      }
      .kura-header-btn.kura-icon-btn svg {
        display: block;
      }

      /* Workspace Dropdown */
      .kura-ws-dropdown {
        position: absolute;
        top: 42px;
        right: 40px;
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        padding: 4px;
        min-width: 180px;
        z-index: 50;
      }
      .kura-ws-dropdown.hidden {
        display: none;
      }
      .kura-ws-item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font: 400 12px var(--font-ui);
        cursor: pointer;
        text-align: left;
      }
      .kura-ws-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .kura-ws-item.active {
        font-weight: 600;
        color: var(--brand-primary);
      }
      .kura-ws-item.action {
        color: var(--text-secondary);
        font-size: 11.5px;
      }

      /* 2. Search (Fixed 36px) */
      .kura-search-wrap {
        height: 36px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        gap: 8px;
        flex-shrink: 0;
      }
      .kura-search-icon {
        color: var(--text-muted);
        display: flex;
        align-items: center;
      }
      .kura-search-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font: 400 12px var(--font-ui);
      }
      .kura-search-input::placeholder {
        color: var(--text-muted);
      }

      /* 3. Toolbar (Fixed 32px) */
      .kura-toolbar {
        height: 32px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        gap: 6px;
        flex-shrink: 0;
      }
      .kura-scope-count {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-right: auto;
      }
      .kura-select {
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        font: 400 11px var(--font-ui);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        outline: none;
      }
      .ghost-btn {
        background: transparent;
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        border-radius: var(--radius-sm);
        padding: 2px 6px;
        font: 500 11px var(--font-ui);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .ghost-btn:hover {
        background: var(--bg-surface-elevated);
        color: var(--text-primary);
      }
      .ghost-btn.active {
        background: rgba(0, 185, 108, 0.12);
        border-color: var(--brand-primary);
        color: var(--brand-primary);
      }

      /* 4. Timeline List */
      .kura-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .kura-timeline-header {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        padding: 6px 2px 2px;
      }

      /* Snippet Card */
      .kura-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: relative;
        transition: border-color 0.15s, background 0.15s;
      }
      .kura-card:hover {
        border-color: var(--border-default);
      }
      .kura-card.pinned {
        border-left: 3px solid var(--brand-primary);
      }
      .kura-card-identity {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kura-card-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .kura-lang-pill {
        font-size: 10px;
        font-weight: 500;
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-secondary);
        text-transform: lowercase;
      }
      .kura-card-pin-btn, .kura-card-menu-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
      }
      .kura-card-pin-btn:hover, .kura-card-menu-btn:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.06);
      }
      .kura-card-pin-btn.active {
        color: var(--brand-primary);
      }
      .kura-card-menu-dropdown {
        position: absolute;
        top: 28px;
        right: 8px;
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        padding: 4px;
        z-index: 30;
        min-width: 140px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .kura-card-menu-dropdown.hidden {
        display: none;
      }
      .kura-menu-item {
        width: 100%;
        padding: 5px 8px;
        background: transparent;
        border: none;
        border-radius: 3px;
        color: var(--text-primary);
        font: 400 11.5px var(--font-ui);
        text-align: left;
        cursor: pointer;
      }
      .kura-menu-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .kura-menu-item.danger {
        color: var(--color-danger);
      }
      .kura-menu-divider {
        height: 1px;
        background: var(--border-subtle);
        margin: 4px 0;
      }

      /* Context row */
      .kura-card-context {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--text-muted);
      }
      .kura-source-link {
        color: var(--text-secondary);
        text-decoration: none;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kura-source-link:hover {
        text-decoration: underline;
      }

      /* Code Preview */
      .kura-card-code {
        margin: 4px 0 6px;
        padding: 6px 8px;
        background: var(--bg-code);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        font: 400 11.5px/1.5 var(--font-code);
        color: #e2e8f0;
        tab-size: 2;
        max-height: 72px;
        overflow-y: hidden;
        overflow-x: auto;
        position: relative;
        transition: max-height 0.15s ease;
      }
      .kura-card-code.wrap {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .kura-card-code.no-wrap {
        white-space: pre;
      }
      .kura-card-code.expanded {
        max-height: 400px;
        overflow-y: auto;
      }

      /* Card Bottom */
      .kura-card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .kura-primary-copy-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        border-radius: var(--radius-sm);
        padding: 4px 10px;
        font: 500 11px var(--font-ui);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: background 0.15s, border-color 0.15s;
      }
      .kura-primary-copy-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: var(--border-default);
      }
      .kura-primary-copy-btn.done {
        background: rgba(0, 185, 108, 0.15);
        border-color: var(--brand-primary);
        color: var(--brand-light);
      }
      .kura-expand-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font: 400 11px var(--font-ui);
        cursor: pointer;
        padding: 2px 4px;
      }
      .kura-expand-btn:hover {
        color: var(--text-secondary);
      }

      /* Modals */
      .kura-modal-backdrop {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 16px;
      }
      .kura-modal {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 340px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .kura-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .kura-modal-header h3 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
      }
      .kura-modal-close {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 14px;
      }
      .kura-modal-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .kura-input-row {
        display: flex;
        gap: 6px;
      }
      .kura-join-input, .kura-input {
        flex: 1;
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        color: var(--text-primary);
        font: 400 12px var(--font-ui);
        outline: none;
      }
      .kura-join-input:focus, .kura-input:focus {
        border-color: var(--border-focus);
      }
      .kura-preview-card {
        background: var(--bg-surface-elevated);
        border: 1px solid rgba(0, 185, 108, 0.3);
        border-radius: var(--radius-sm);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .kura-preview-badge {
        font-size: 10px;
        font-weight: 600;
        color: var(--brand-primary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .kura-preview-title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .kura-preview-sub {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .kura-code-error {
        font-size: 11.5px;
        color: var(--color-danger);
      }
      .kura-btn {
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        font: 500 12px var(--font-ui);
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .kura-btn-primary {
        background: var(--brand-primary);
        border-color: var(--brand-primary);
        color: #fff;
      }
      .kura-btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Skeleton Cards */
      .kura-skeleton-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .kura-skeleton-line {
        height: 12px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
        animation: pulse 1.2s infinite ease-in-out;
      }
      .kura-skeleton-line.short {
        width: 45%;
      }
      .kura-skeleton-box {
        height: 48px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 4px;
        animation: pulse 1.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      /* Empty State */
      .kura-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 36px 16px;
        gap: 8px;
      }
      .kura-empty-icon {
        color: var(--text-muted);
        opacity: 0.4;
      }
      .kura-empty-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .kura-empty-sub {
        margin: 0;
        font-size: 11.5px;
        color: var(--text-muted);
        line-height: 1.45;
      }

      /* Cheat sheet */
      .kura-cheat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 11.5px;
      }
      .kura-cheat-row kbd {
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-default);
        border-radius: 3px;
        padding: 2px 5px;
        font-family: var(--font-code);
        font-size: 11px;
      }

      /* Toast */
      .kura-toast {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-default);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        border-radius: var(--radius-md);
        padding: 6px 12px;
        font-size: 12px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 40;
        white-space: nowrap;
      }
      .kura-toast.hidden {
        display: none;
      }
      .kura-toast.success {
        border-color: var(--brand-primary);
      }
      .kura-toast-undo {
        background: transparent;
        border: 1px solid var(--brand-primary);
        color: var(--brand-primary);
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 10.5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
